<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog - Blood Donation Hub</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"></head>
<body>
<main class="page"><h1>Blog</h1><p class="sub">News and tips about blood donation.</p>
<div id="list" class="list"></div></main>
<script src="app.js"></script>
<script>layout('blog.html');
api('/api/posts').then((rows) => {
  $('#list').innerHTML = rows.map((p) => `<article class="card"><h2 style="margin-top:0">${esc(p.title)}</h2><p style="white-space:pre-line">${esc(p.content)}</p><span class="muted">${esc(p.author)} · ${new Date(p.createdAt).toLocaleDateString()}</span></article>`).join('') || '<p>No posts yet.</p>';
});</script>
</body></html>
